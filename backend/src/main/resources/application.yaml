spring:
  application:
    name: Backend
  main:
    allow-circular-references: true

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: false
          ssl:
            enable: ${MAIL_USE_SSL:false}
            trust: "*"
            protocols: TLSv1.2
          socketFactory:
            port: ${MAIL_PORT}
            class: ${MAIL_SOCKET_FACTORY:javax.net.ssl.SSLSocketFactory}
            fallback: false
          connectiontimeout: 30000
          timeout: 30000
          writetimeout: 30000

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: ${PORT:8080}

app:
  mail:
    admin: ${MAIL_ADMIN}
    from-name: ${MAIL_FROM_NAME}
    enabled: ${MAIL_ENABLED}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

logging:
  level:
    com.ooadproject: INFO
    org.springframework.security: INFO
